spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test_runs}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
